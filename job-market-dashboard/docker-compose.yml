# Job Market Skills Intelligence Dashboard
# Docker Compose Configuration
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f backend    # View backend logs
#   docker compose down               # Stop all services
#
# First time setup:
#   1. Copy .env.example to .env and fill in your API keys
#   2. Run: docker compose up -d
#   3. Run migrations: docker compose exec backend alembic upgrade head
#   4. Access dashboard at http://localhost:3000

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: jobmarket-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jobmarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jobmarket-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jobmarket-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jobmarket}
      - DATABASE_SYNC_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jobmarket}
      - REDIS_URL=redis://redis:6379/0
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - SCRAPERAPI_KEY=${SCRAPERAPI_KEY:-}
      - BRIGHTDATA_USERNAME=${BRIGHTDATA_USERNAME:-}
      - BRIGHTDATA_PASSWORD=${BRIGHTDATA_PASSWORD:-}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-change-this-in-production}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://frontend:3000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}/api/v1
    container_name: jobmarket-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Scheduler (optional - for automated scraping)
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: jobmarket-scheduler
    restart: unless-stopped
    command: python -m app.scheduler
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jobmarket}
      - DATABASE_SYNC_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jobmarket}
      - REDIS_URL=redis://redis:6379/0
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - SCRAPERAPI_KEY=${SCRAPERAPI_KEY:-}
      - BRIGHTDATA_USERNAME=${BRIGHTDATA_USERNAME:-}
      - BRIGHTDATA_PASSWORD=${BRIGHTDATA_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - scheduler

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: jobmarket-network
